<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YingTin App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml" href="yingtin_app_icon.svg">
</head>

<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">🍎</div>
            <h1 class="splash-title">YingTin App</h1>
            <p class="splash-subtitle">您的精選生活小幫手</p>
            <div class="splash-loader">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <h1 class="app-title" style="margin: 0;">YingTin App</h1>
                <span class="version-badge">v26.01</span>
            </div>
            <div class="header-auth">
                <button id="refreshAppBtn" class="lang-toggle-btn"
                    style="margin-right:10px; font-size:1.2rem; cursor:pointer;"
                    onclick="window.location.reload(true)">🔄</button>
                <button id="loginBtn" class="login-btn">
                    <span>🔑</span> 登入
                </button>
                <div id="userInfo" class="user-info" style="display:none">
                    <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                    <span id="userName" class="user-name"></span>
                    <button id="logoutBtn" class="logout-btn">登出</button>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="app-content" id="appContent">
            <!-- Content will be injected by script.js -->
            <div id="page-content" class="fade-in">
                <div class="fruit-page">
                    <div class="fruit-image-container">
                        <span class="fruit-emoji">🍎</span>
                    </div>
                    <h2 class="fruit-name">蘋果</h2>
                    <p class="fruit-description">新鮮甜美的紅蘋果，充滿營養與活力。</p>
                    <div id="gameActionContainer"></div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-track-container" id="navTrackContainer">
                <div class="nav-track" id="navTrack">
                    <!-- Page 1 -->
                    <div class="nav-page">
                        <button class="nav-item active" data-page="apple">
                            <div class="nav-icon">🍎</div>
                            <span class="nav-label">蘋果</span>
                        </button>
                        <button class="nav-item" data-page="banana">
                            <div class="nav-icon">🍌</div>
                            <span class="nav-label">香蕉</span>
                        </button>
                        <button class="nav-item" data-page="lemon">
                            <div class="nav-icon">🍋</div>
                            <span class="nav-label">檸檬</span>
                        </button>
                        <button class="nav-item" data-page="mango">
                            <div class="nav-icon">🥭</div>
                            <span class="nav-label">芒果</span>
                        </button>
                        <button class="nav-item" data-page="pineapple">
                            <div class="nav-icon">🍍</div>
                            <span class="nav-label">鳳梨</span>
                        </button>
                    </div>
                    <!-- Page 2 -->
                    <div class="nav-page">
                        <button class="nav-item" data-page="strawberry">
                            <div class="nav-icon">🍓</div>
                            <span class="nav-label">士多啤梨</span>
                        </button>
                        <button class="nav-item" data-page="potato">
                            <div class="nav-icon">🥔</div>
                            <span class="nav-label">馬鈴薯</span>
                        </button>
                        <button class="nav-item" data-page="tomato">
                            <div class="nav-icon">🍅</div>
                            <span class="nav-label">番茄</span>
                        </button>
                        <button class="nav-item" data-page="vegetable">
                            <div class="nav-icon">🥦</div>
                            <span class="nav-label">蔬菜</span>
                        </button>
                        <button class="nav-item" data-page="icecream">
                            <div class="nav-icon">🍦</div>
                            <span class="nav-label">雪糕</span>
                        </button>
                    </div>
                    <!-- Page 3 -->
                    <div class="nav-page">
                        <button class="nav-item" data-page="tree">
                            <div class="nav-icon">🌳</div>
                            <span class="nav-label">大樹</span>
                        </button>
                        <button class="nav-item" data-page="flower">
                            <div class="nav-icon">🌸</div>
                            <span class="nav-label">花朵</span>
                        </button>
                        <button class="nav-item" data-page="leaf">
                            <div class="nav-icon">🍃</div>
                            <span class="nav-label">葉子</span>
                        </button>
                        <button class="nav-item" data-page="sun">
                            <div class="nav-icon">☀️</div>
                            <span class="nav-label">太陽</span>
                        </button>
                        <button class="nav-item" data-page="mountain">
                            <div class="nav-icon">⛰️</div>
                            <span class="nav-label">高山</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="nav-indicators">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </nav>
    </div>

    <!-- Snake Game Overlay -->
    <div id="gameOverlay" class="game-overlay hidden">
        <div class="game-header" style="padding-top: 85px;">
            <button id="closeGameBtn" class="close-game-btn">❌</button>
            <div class="game-score">Score: <span id="currentScore">0</span></div>
            <div style="display:flex; gap:5px;">
                <button id="refreshGameBtn" class="lang-btn"
                    style="cursor:pointer; background:rgba(255,255,255,0.1); border:none; border-radius:4px;"
                    onclick="window.location.reload(true)">🔄</button>
                <button id="langToggleBtn" class="lang-btn">EN/中</button>
            </div>
        </div>
        <div class="game-canvas-container">
            <canvas id="gameCanvas" width="300" height="300"></canvas>

            <div id="gameStartScreen" class="game-over-screen">
                <h2 class="game-title">🍎 Apple Snake</h2>
                <p>Eat apples, grow long!</p>
                <div class="name-input-container">
                    <input type="text" id="playerNameInput" placeholder="Enter Your Name / 輸入名字" maxlength="12">
                </div>
                <div class="menu-actions">
                    <button id="startGameBtn" class="restart-btn">Start Game / 開始</button>
                    <button id="showLeaderboardBtn" class="menu-btn secondary">🏆 Top Scores / 排行榜</button>
                </div>
            </div>

            <div id="gameOverScreen" class="game-over-screen hidden">
                <h2 id="gameOverTitle" class="game-over-title">Game Over!</h2>
                <div class="final-score-box">
                    <span id="finalScore">0</span>
                </div>
                <div class="menu-actions">
                    <button id="restartGameBtn" class="restart-btn">Try Again</button>
                    <button id="showLeaderboardBtn2" class="menu-btn secondary">🏆 Top Scores / 排行榜</button>
                    <button id="goToMenuBtn" class="menu-btn">Back to Menu</button>
                </div>
            </div>
        </div>

        <!-- Directional Controls -->
        <div class="d-pad-container">
            <button class="d-pad-btn up" id="btnUp">▲</button>
            <div class="d-pad-middle">
                <button class="d-pad-btn left" id="btnLeft">◀</button>
                <button class="d-pad-btn right" id="btnRight">▶</button>
            </div>
            <button class="d-pad-btn down" id="btnDown">▼</button>
        </div>
    </div>



    <!-- Leaderboard Modal (Shared) -->
    <div id="leaderboardModal" class="game-over-screen hidden"
        style="z-index: 3000; position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h3 id="leaderboardTitle" style="margin-top: 40px;">Top 10</h3>
        <div class="leaderboard-tabs" style="display: flex; gap: 5px; margin-bottom: 15px;">
            <button class="tab-btn" data-period="daily">日</button>
            <button class="tab-btn" data-period="weekly">週</button>
            <button class="tab-btn" data-period="monthly">月</button>
            <button class="tab-btn active" data-period="all">總</button>
        </div>
        <ul id="leaderboardList"
            style="width: 80%; max-width: 300px; padding: 0; list-style: none; overflow-y: auto; max-height: 50vh;">
        </ul>
        <button id="closeLeaderboardBtn" class="menu-btn" style="margin-top: 20px;">Close / 關閉</button>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="snake.js"></script>
    <script src="script.js" type="module"></script>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script>
        // --- Auto-Refresh Logic for Service Worker ---
        let refreshing = false;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }

        // --- Lock zoom ---
        document.addEventListener('touchstart', function (e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', function (e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault(); // block double-tap zoom
            lastTouchEnd = now;
        }, false);

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>
</body>

</html>
