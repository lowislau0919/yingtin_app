<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YingTin App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="yingtin_app_icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">🍎</div>
            <h1 class="splash-title">YingTin App</h1>
            <p class="splash-subtitle">您的精選生活小幫手</p>
            <div class="splash-loader">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="app-title">YingTin App</h1>
            <div class="header-auth">
                <button id="loginBtn" class="login-btn">
                    <span>🔑</span> 登入
                </button>
                <div id="userInfo" class="user-info" style="display:none">
                    <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                    <span id="userName" class="user-name"></span>
                    <button id="logoutBtn" class="logout-btn">登出</button>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="app-content" id="appContent">
            <!-- Content will be injected by script.js -->
            <div id="page-content" class="fade-in">
                <div class="fruit-page">
                    <div class="fruit-image-container">
                        <span class="fruit-emoji">🍎</span>
                    </div>
                    <h2 class="fruit-name">蘋果</h2>
                    <p class="fruit-description">新鮮甜美的紅蘋果，充滿營養與活力。</p>
                    <div id="gameActionContainer"></div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-track-container" id="navTrackContainer">
                <div class="nav-track" id="navTrack">
                    <!-- Page 1 -->
                    <div class="nav-page">
                        <button class="nav-item active" data-page="snakeGame">
                            <div class="nav-icon">🐍</div>
                            <span class="nav-label">貪食蛇</span>
                        </button>
                        <button class="nav-item" data-page="banana">
                            <div class="nav-icon">🍌</div>
                            <span class="nav-label">香蕉</span>
                        </button>
                        <button class="nav-item" data-page="lemon">
                            <div class="nav-icon">🍋</div>
                            <span class="nav-label">檸檬</span>
                        </button>
                        <button class="nav-item" data-page="mango">
                            <div class="nav-icon">🥭</div>
                            <span class="nav-label">芒果</span>
                        </button>
                        <button class="nav-item" data-page="pineapple">
                            <div class="nav-icon">🍍</div>
                            <span class="nav-label">鳳梨</span>
                        </button>
                    </div>
                    <!-- Page 2 -->
                    <div class="nav-page">
                        <button class="nav-item" data-page="strawberry">
                            <div class="nav-icon">🍓</div>
                            <span class="nav-label">士多啤梨</span>
                        </button>
                        <button class="nav-item" data-page="potato">
                            <div class="nav-icon">🥔</div>
                            <span class="nav-label">馬鈴薯</span>
                        </button>
                        <button class="nav-item" data-page="tomato">
                            <div class="nav-icon">🍅</div>
                            <span class="nav-label">番茄</span>
                        </button>
                        <button class="nav-item" data-page="vegetable">
                            <div class="nav-icon">🥦</div>
                            <span class="nav-label">蔬菜</span>
                        </button>
                        <button class="nav-item" data-page="icecream">
                            <div class="nav-icon">🍦</div>
                            <span class="nav-label">雪糕</span>
                        </button>
                    </div>
                    <!-- Page 3 -->
                    <div class="nav-page">
                        <button class="nav-item" data-page="tree">
                            <div class="nav-icon">🌳</div>
                            <span class="nav-label">大樹</span>
                        </button>
                        <button class="nav-item" data-page="flower">
                            <div class="nav-icon">🌸</div>
                            <span class="nav-label">花朵</span>
                        </button>
                        <button class="nav-item" data-page="leaf">
                            <div class="nav-icon">🍃</div>
                            <span class="nav-label">葉子</span>
                        </button>
                        <button class="nav-item" data-page="sun">
                            <div class="nav-icon">☀️</div>
                            <span class="nav-label">太陽</span>
                        </button>
                        <button class="nav-item" data-page="mountain">
                            <div class="nav-icon">⛰️</div>
                            <span class="nav-label">高山</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="nav-indicators">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </nav>
    </div>

    <!-- Game Overlay -->
    <div id="gameOverlay" class="game-overlay hidden">
        <div class="game-header">
            <button id="closeGameBtn" class="close-game-btn">❌</button>
            <div class="game-score">Score: <span id="currentScore">0</span></div>
            <button id="langToggleBtn" class="lang-btn">EN/中</button>
        </div>
        <div class="game-canvas-container">
            <canvas id="gameCanvas" width="300" height="300"></canvas>
            
            <div id="gameStartScreen" class="game-over-screen">
                <h2>貪食蛇</h2>
                <p>Snake</p>
                <button id="startGameBtn" class="restart-btn">Start Game / 開始</button>
            </div>

            <div id="gameOverScreen" class="game-over-screen hidden">
                <h2 id="gameOverTitle">Game Over</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <button id="restartGameBtn" class="restart-btn">Try Again</button>
                <div id="leaderboardContainer" class="leaderboard-container">
                    <h3 id="leaderboardTitle">Top 10</h3>
                    <ul id="leaderboardList"></ul>
                </div>
            </div>
        </div>
        <div class="d-pad-container">
            <button class="d-pad-btn up" id="btnUp">▲</button>
            <div class="d-pad-middle">
                <button class="d-pad-btn left" id="btnLeft">◀</button>
                <button class="d-pad-btn right" id="btnRight">▶</button>
            </div>
            <button class="d-pad-btn down" id="btnDown">▼</button>
        </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="snake.js"></script>
    <script src="script.js" type="module"></script>
    <script>
        // --- Auto-Refresh Logic for Service Worker ---
        let refreshing = false;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }

        // --- Lock zoom ---
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault(); // block double-tap zoom
            lastTouchEnd = now;
        }, false);

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>
</body>
</html>
